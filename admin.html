<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ადმინ პანელი — წიგნების ბლოგი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">წიგნების ბლოგი</a>
  <nav><a href="index.html">მთავარი</a><a href="admin.html" aria-current="page">ადმინი</a></nav>
</header>
<main class="narrow">
  <p id="notice" class="notice" hidden>Firebase ჯერ არ არის დაკავშირებული. შეავსე js/firebase-config.js.</p>

  <form id="login" class="form" hidden>
    <h1>შესვლა</h1>
    <label>ელფოსტა<input type="email" id="email" required autocomplete="username"></label>
    <label>პაროლი<input type="password" id="password" required autocomplete="current-password"></label>
    <button type="submit">შესვლა</button>
    <p class="msg" id="login-msg" role="alert"></p>
  </form>

  <form id="post-form" class="form" hidden>
    <h1 id="form-title">ახალი პოსტი</h1>
    <label>წიგნის სათაური<input id="title" required></label>
    <label>წიგნის ავტორი<input id="bookAuthor" required></label>
    <label>ანალიზის ავტორი<input id="reviewAuthor" required></label>
    <div class="field">
      <span id="content-label">სრული ანალიზი</span>
      <div class="rt">
        <div class="toolbar" id="rt-toolbar" role="toolbar" aria-label="ტექსტის ფორმატირება">
          <button type="button" data-cmd="bold" title="გამუქება (Ctrl+B)" aria-label="გამუქება"><b>B</b></button>
          <button type="button" data-cmd="italic" title="დახრა (Ctrl+I)" aria-label="დახრა"><i>I</i></button>
          <button type="button" data-cmd="underline" title="ხაზგასმა (Ctrl+U)" aria-label="ხაზგასმა"><u>U</u></button>
          <button type="button" data-cmd="strikeThrough" title="გადახაზვა" aria-label="გადახაზვა"><s>S</s></button>
          <span class="sep"></span>
          <select id="rt-size" aria-label="ტექსტის ზომა" title="ტექსტის ზომა">
            <option value="">ზომა</option>
            <option value="0.85rem">პატარა</option>
            <option value="1.075rem">ჩვეულებრივი</option>
            <option value="1.3rem">დიდი</option>
            <option value="1.6rem">უფრო დიდი</option>
            <option value="2rem">სათაური</option>
            <option value="2.6rem">დიდი სათაური</option>
          </select>
          <span class="tb-pal" data-pal="foreColor" data-var="--rt-fore">
            <button type="button" class="tb-btn" title="ტექსტის ფერი" aria-label="ტექსტის ფერი" aria-haspopup="true"><span class="tb-a tb-fore">A</span></button>
            <div class="palette" hidden></div>
          </span>
          <span class="tb-pal" data-pal="hiliteColor" data-var="--rt-back">
            <button type="button" class="tb-btn" title="ტექსტის მონიშვნა (ფონის ფერი)" aria-label="ფონის ფერი" aria-haspopup="true"><span class="tb-a tb-back">A</span></button>
            <div class="palette" hidden></div>
          </span>
          <span class="sep"></span>
          <button type="button" data-cmd="justifyLeft" title="მარცხნივ" aria-label="მარცხნივ"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 10h12M3 14h18M3 18h12"/></svg></button>
          <button type="button" data-cmd="justifyCenter" title="ცენტრში" aria-label="ცენტრში"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M6 10h12M3 14h18M6 18h12"/></svg></button>
          <button type="button" data-cmd="justifyRight" title="მარჯვნივ" aria-label="მარჯვნივ"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M9 10h12M3 14h18M9 18h12"/></svg></button>
          <button type="button" data-cmd="justifyFull" title="ორივე მხარეს გასწორება" aria-label="ორივე მხარეს გასწორება"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 10h18M3 14h18M3 18h18"/></svg></button>
          <span class="sep"></span>
          <button type="button" data-cmd="insertUnorderedList" title="სია" aria-label="სია"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg></button>
          <button type="button" data-cmd="insertOrderedList" title="დანომრილი სია" aria-label="დანომრილი სია">1.</button>
          <button type="button" data-cmd="quote" title="ციტატა" aria-label="ციტატა">“</button>
          <span class="sep"></span>
          <button type="button" data-cmd="clear" title="ფორმატირების გასუფთავება" aria-label="ფორმატირების გასუფთავება">T<sub>x</sub></button>
        </div>
        <div id="content" class="rt-area" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="content-label" lang="ka"><p><br></p></div>
      </div>
      <small class="hint">მონიშნე ტექსტი და აირჩიე ფორმატი (ფერიც და ზომაც მონიშნულ ტექსტზე მუშაობს). ჩასმისას ტექსტი უბრალოდ ჩაჯდება, ფორმატირება შემდეგ დაამატე.</small>
    </div>
    <label><span id="cover-label">წიგნის გარეკანი</span><input type="file" id="cover" accept="image/*" required></label>
    <div class="row">
      <button type="submit" id="publish">გამოქვეყნება</button>
      <button type="button" id="cancel-edit" class="ghost" hidden>გაუქმება</button>
      <button type="button" id="logout" class="ghost">გამოსვლა</button>
    </div>
    <p class="msg" id="post-msg" role="status"></p>
  </form>
  <section id="manage" class="manage" hidden>
    <h2>ჩემი პოსტები</h2>
    <div id="manage-list"></div>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/richtext.js"></script>
<script src="js/editor.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
